name: Build luci-app-connlimit APK | Netcore N60 25.12 SDK
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache

      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: plugin-src

      - name: Download official OpenWrt 25.12 SDK mediatek/filogic
        run: |
          wget https://downloads.openwrt.org/releases/25.12-SNAPSHOT/targets/mediatek/filogic/openwrt-sdk-25.12-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-25.12-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64 openwrt-sdk

      - name: Copy plugin into SDK
        run: |
          rm -rf openwrt-sdk/package/luci-app-connlimit
          cp -r plugin-src/ openwrt-sdk/package/luci-app-connlimit/
          chmod +x openwrt-sdk/package/luci-app-connlimit/root/etc/init.d/connlimit
          chmod +x openwrt-sdk/package/luci-app-connlimit/root/usr/sbin/connlimit-nft.sh

      - name: Update feeds
        working-directory: ./openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Compile plugin only
        working-directory: ./openwrt-sdk
        run: |
          make package/luci-app-connlimit/compile V=sc

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-connlimit-N60-APK
          path: openwrt-sdk/bin/packages/aarch64_cortex-a53/base/*.apk
          retention-days: 30
