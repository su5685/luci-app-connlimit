name: Build luci-app-connlimit APK Direct Package
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Install opkg build tools
        run: |
          sudo apt update
          sudo apt install -y opkg-utils tar gzip

      - name: Prepare package root
        run: |
          mkdir -p pkg/usr/lib/lua
          mkdir -p pkg/etc
          mkdir -p pkg/usr/sbin
          cp -r luasrc/* pkg/usr/lib/lua/
          cp -r root/etc/* pkg/etc/
          cp -r root/usr/sbin/* pkg/usr/sbin/
          chmod 755 pkg/etc/init.d/connlimit
          chmod 755 pkg/usr/sbin/connlimit-nft.sh
          mkdir -p pkg/CONTROL
          echo "Package: luci-app-connlimit" > pkg/CONTROL/control
          echo "Version: 2.0-1" >> pkg/CONTROL/control
          echo "Architecture: aarch64_cortex-a53" >> pkg/CONTROL/control
          echo "Maintainer: su5685" >> pkg/CONTROL/control
          echo "Section: luci" >> pkg/CONTROL/control
          echo "Category: LuCI" >> pkg/CONTROL/control
          echo "Depends: luci-base, nftables" >> pkg/CONTROL/control
          echo "Title: Connlimit nftables 新建连接限制" >> pkg/CONTROL/control
          echo "Description: LuCI UI for nftables ct count limit" >> pkg/CONTROL/control

      - name: Build apk package
        run: |
          opkg-build pkg ./
          ls -l *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-connlimit-N60-apk
          path: *.apk
          retention-days: 30
