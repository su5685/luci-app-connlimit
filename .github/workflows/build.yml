name: Build luci-app-connlimit
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: openwrt/sdk:25.12-mediatek-filogic
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare package structure
        run: |
          mkdir -p pkg/usr/lib/lua pkg/etc pkg/usr/sbin pkg/CONTROL
          cp -r luasrc/* pkg/usr/lib/lua/
          cp -r root/etc/* pkg/etc/
          cp -r root/usr/sbin/* pkg/usr/sbin/
          chmod 755 pkg/etc/init.d/connlimit
          chmod 755 pkg/usr/sbin/connlimit-nft.sh
          cat > pkg/CONTROL/control <<'EOF'
Package: luci-app-connlimit
Version: 2.0-1
Architecture: aarch64_cortex-a53
Maintainer: su5685
Section: luci
Category: LuCI
Depends: luci-base, nftables
Title: Connlimit nftables 连接限制
Description: LuCI UI for nftables ct limit
EOF

      - name: Build package
        run: opkg-build pkg ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-connlimit-apk
          path: *.apk
